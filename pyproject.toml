[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tally-budget"
version = "0.1.0"
description = "A personal budget tracker for the terminal: import your bank CSVs, categorise with rules, see where your money goes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tamygigs" }]
keywords = ["budget", "finance", "cli", "terminal", "csv"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tally = "tally.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
